## https://github.com/Limine-Bootloader/Limine/blob/v12.x/CONFIG.md

# Global options. These are active only when they are not prefixed with '#'.

# Menu timeout in seconds; use 'no' to require a selection.
timeout: 10

# Select the initial entry by 1-based index or by entry path.
# default_entry: 1

# Remember the last booted entry (UEFI only).
# remember_last_entry: no

# Keep the boot menu quiet while retaining the timeout.
# quiet: no

# Enable serial I/O (BIOS only).
# serial: no

# Serial baudrate when serial I/O is enabled.
# serial_baudrate: 115200

# Use a replacement DTB for Limine and compatible entries.
# global_dtb: boot():/boot/board.dtb

# Force text mode instead of a graphical menu.
# graphics: yes

# Use a wallpaper image; this option may be repeated.
# wallpaper: boot():/boot/wallpaper.png

# Wallpaper placement: tiled, centered, or stretched.
# wallpaper_style: stretched

# Backdrop colour used around a centered wallpaper (RRGGBB).
# backdrop: 000000

# Print additional boot information.
verbose: yes

# Suppress informational loading messages.
# terse: no

# Fill RAM with random data at boot; slower, useful for debugging.
# randomise_memory: no
# Alias: randomize_memory: no

# Continue with a warning instead of panicking on a file hash mismatch.
# hash_mismatch_panic: yes

# Opt in to measured boot when TPM 2.0 support is available.
# measured_boot: no

# Restore the firmware logo on handoff (UEFI only).
# firmware_logo: no

# Remap printable keys: dvorak or azerty.
# keyboard_layout: dvorak

# Disable pointer support in the menu.
# mouse: yes

# Limine interface resolution; ignored in text mode.
# interface_resolution: 1920x1080

# Rotate the Limine interface: 0, 90, 180, or 270 degrees.
# interface_rotation: 0

# Text shown above the Limine interface.
interface_branding: VOL Limine Bootloader

# Interface branding colour (RRGGBB).
# interface_branding_colour: 00aaaa
# Alias: interface_branding_color: 00aaaa

# Hide the key-binding help text.
# interface_help_hidden: no

# Help text colours (RRGGBB).
# interface_help_colour: 00aa00
# interface_help_colour_bright: 55ff55
# Aliases: interface_help_color and interface_help_color_bright

# Graphical terminal font file and glyph size.
# term_font: boot():/boot/font.psf
# term_font_size: 8x16

# Graphical terminal font scaling and character spacing.
# term_font_scale: 1x1
# term_font_spacing: 1

# Eight-colour terminal palettes (RRGGBB, semicolon separated).
# term_palette: 000000;aa0000;00aa00;aa5500;0000aa;aa00aa;00aaaa;aaaaaa
# term_palette_bright: 555555;ff5555;55ff55;ffff55;5555ff;ff55ff;55ffff;ffffff

# Terminal colours and margins. term_background uses TTRRGGBB.
# term_background: 00000000
# term_foreground: aaaaaa
# term_background_bright: 555555
# term_foreground_bright: ffffff
# term_margin: 0
# term_margin_gradient: 0

# Boot editor controls.
# editor_enabled: yes
# editor_highlighting: yes
# editor_validation: yes

# The entry title shown in the boot menu.
/VOL v@VERSION@
    # We use the Limine boot protocol.
    protocol: limine

    # Kernel path; boot():/ means the partition containing this config.
    path: boot():/boot/kernel
    # Alias: kernel_path: boot():/boot/kernel

    # Optional entry description shown when this entry is selected.
    comment: VOL kernel

    # Pass a command line to the kernel.
    cmdline: greeting=hello debug=1
    # Alias: kernel_cmdline:

    # Hide this entry unless the firmware or CPU matches.
    # if_fw_type: UEFI
    # if_arch: x86-64
    # if_loader_arch: x86-64

    # Load an additional module; this option may be repeated.
    # module_path: boot():/boot/module

    # Associate a string with the most recently declared module.
    # module_string: module-name
    # Alias: module_cmdline: module-name

    # Kernel framebuffer resolution, optionally with bits per pixel.
    # resolution: 1920x1080x32

    # Enable kernel address space layout randomisation for relocatable kernels.
    # kaslr: no

    # Randomise the higher-half direct-map base when KASLR is enabled.
    # randomise_hhdm_base: no
    # Alias: randomize_hhdm_base: no

    # Limit paging mode: 4level or 5level on x86-64/aarch64.
    # max_paging_mode: 5level
    # min_paging_mode: 4level
    # Or set both limits at once:
    # paging_mode: 4level

    # Pass a replacement device tree blob to the kernel.
    # dtb_path: boot():/boot/board.dtb
